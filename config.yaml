profile:
  offer: |
    Carson AI Agency es una agencia de marketing digital especializada en SEO,
    Google Ads, Performance Marketing, Marketing B2B, generación de demanda,
    analítica y consultoría de crecimiento.
  ideal_client: |
    Empresas B2B y B2C de México y España que estén buscando activamente una
    agencia, consultor o especialista externo para captar clientes, mejorar SEO,
    gestionar Google Ads, optimizar campañas o generar oportunidades comerciales.
    Prioridad para empresas con una necesidad concreta y capacidad de contratación.
  not_a_fit: |
    Ofertas de empleo full-time, prácticas, estudiantes, cursos, personas ofreciendo
    sus propios servicios, freelancers buscando trabajo, agencias buscando
    subcontratación barata, intercambios, colaboraciones sin presupuesto o consultas
    puramente informativas.
  tone: "profesional, directo, consultivo y breve; sin venta agresiva"
  signature: ""
  report_language: es

queries:
  - "busco agencia de marketing"
  - "buscamos agencia de marketing"
