profile:
  offer: |
    Carson AI Agency es una agencia de marketing digital especializada en SEO,
    Google Ads, Performance Marketing, Marketing B2B, generación de demanda,
    analítica y consultoría de crecimiento.
  ideal_client: |
    Empresas con actividad real en México, España, Latinoamérica o Estados Unidos
    que necesiten contratar servicios de marketing EN ESPAÑOL para su mercado
    hispanohablante. Priorizar decisiones de compra explícitas: solicitan
    cotizaciones, propuestas, RFP, presupuesto, agencia externa o proveedor
    para SEO, Google Ads, SEM, Performance Marketing, generación de leads,
    marketing B2B o consultoría digital. Valorar más si indican responsable,
    alcance, presupuesto, plazo, canal de contacto y contratación inmediata.
    Clasificar cada oportunidad en tres categorias: (A) CONTRATACION DIRECTA
    de un servicio concreto de Carson, prioridad maxima; (B) PROYECTO CON
    PRESUPUESTO o solicitud de propuesta concreta, prioridad alta si hay
    encaje; (C) LICITACION INTEGRAL que exige PR, influencers, creatividad,
    medios offline o varios proveedores, prioridad baja aunque exista RFP.
    Puntuar el ENCAJE COMERCIAL con Carson, no solo la certeza de que se
    contratara alguna agencia. Para categoria C, limitar a 50/100 salvo
    que la empresa acepte expresamente una propuesta parcial de SEO,
    performance o captacion digital. Para A y B valorar necesidad,
    presupuesto, contacto, plazo, geografia e idioma.
    Incluir tambien empresas que expresan un problema de captacion, ventas,
    SEO, Google Ads o demanda B2B aunque todavia no soliciten presupuesto.
    Estas son oportunidades POTENCIALES, no contratos confirmados; no
    inventar urgencia ni presupuesto. Diferenciar A contratacion directa,
    B proyecto concreto y C necesidad detectada. Las licitaciones amplias
    son D exploratorias y no deben confundirse con compradores inmediatos.
    Una publicacion en español no prueba por si sola mercado objetivo.
  not_a_fit: |
    No confundir licitacion real con buen encaje para Carson. Grandes
    concursos integrales que exijan consorcios, varias agencias o servicios
    fuera del alcance de Carson deben quedar en prioridad baja,
    identificadas como exploratorias. Solo descartar si no hay ningun
    componente relevante para Carson.
    Colaboraciones genéricas, networking, intercambios, trueques, alianzas
    sin contratación explícita, búsqueda de partners para proyectos futuros,
    agencias reclutando otras agencias sin presupuesto confirmado, trabajos
    gratis o a comisión, ofertas de empleo, freelancers que ofrecen servicios,
    cursos, prácticas y consultas informativas. Descartar publicaciones que
    solo piden creatividad audiovisual, PR, influencers o branding sin
    demanda de servicios de Carson. Descartar solicitudes dirigidas
    exclusivamente a mercados no hispanohablantes. No inventar presupuesto
    ni decisión de compra: si no está claro, no calificar como lead prioritario.
  tone: "profesional, directo, consultivo y breve; sin venta agresiva"
  signature: ""
  report_language: es

queries:
  - "busco agencia SEO"
  - "necesito agencia SEO"
  - "recomendación agencia SEO"
  - "busco experto Google Ads"
  - "necesitamos ayuda Google Ads"
  - "buscamos agencia de marketing"
  - "recomiendan agencia marketing"
  - "busco consultor marketing"
  - "captación clientes B2B"
  - "necesitamos más leads"
  - "campañas no convierten"
  - "mejorar posicionamiento web"
  - "externalizar marketing"
  - "agencia performance"
  - "auditoría Google Ads"
  - "necesitamos marketing ecommerce"
  - "agencia Shopify"
  - "consultoría ecommerce"

exclude:
  - "ofrezco mis servicios"
  - "soy freelance"
  - "busco trabajo"
  - "[for hire]"

max_age_hours: 168

sources:
  hackernews:
    enabled: true
    queries: ["SEO", "marketing agency", "Google Ads", "B2B leads", "customer acquisition"]

  bluesky:
    enabled: true
    langs: [es]
    queries: ["agencia SEO", "Google Ads", "captar clientes", "marketing B2B", "necesito marketing", "posicionamiento web", "agencia marketing"]

  freelancer:
    enabled: true
    queries: ["SEO español", "Google Ads", "marketing digital", "lead generation", "marketing B2B"]

  workana:
    enabled: false

  apify:
    enabled: true
    max_per_query: 10
    max_wait_seconds: 480
    x_lang: ""
    queries:
      - "busco agencia SEO"
      - "necesito SEO"
      - "busco Google Ads"
      - "agencia marketing"
      - "necesitamos leads"
      - "captación B2B"
      - "recomiendan agencia"
      - "ayuda con Google Ads"
      - "consultor ecommerce"
      - "marketing Shopify"
      - "contratar marketing"
      - "presupuesto SEO"
    actors:
      - preset: linkedin
      - preset: x
      - preset: reddit

  web:
    enabled: true
    provider: ddgs
    queries:
      - "busco agencia"
      - "necesito SEO"
      - "Google Ads ayuda"
      - "necesitamos leads"
      - "recomiendan agencia"
      - "marketing B2B"
    sites:
      - linkedin.com/posts
      - reddit.com
      - quora.com
      - indiehackers.com
    freshness: week
    results_per_query: 8
    max_requests: 24
    region: es-es

  reddit:
    enabled: false  # Reddit RSS suele estar bloqueado en Actions; usar Apify preset

  agentreach:
    enabled: false

  rss:
    enabled: false
    feeds: []

  scrape:
    enabled: false
    pages: []

scoring:
  provider: gemini
  model: ""
  base_url: ""
  effort: medium
  batch_size: 15
  max_items_per_run: 150

notify:
  min_score: 40
  max_leads: 30
  telegram:
    enabled: true
    notify_empty: true
  discord:
    enabled: false
  slack:
    enabled: false

storage:
  db_path: data/leadradar.db
  output_dir: output
